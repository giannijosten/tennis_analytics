name: Tennis Retail Data Scraper

on:
  schedule:
    # Geplante Ausführung um 04:00 und 16:00 Uhr UTC
    # Entspricht 06:00 und 18:00 Uhr deutscher Sommerzeit (MESZ) – morgendliche und abendliche Preisanpassungen tracken
    - cron: '0 4 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: # Ermöglicht den manuellen Start des Daten-Scraping-Prozesses direkt auf GitHub

jobs:
  market_analysis_crawl:
    name: Execute Scrapy Spiders for Tennis Equipment Monitoring
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v6

    - name: 2. Initialize Python Environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11.5'
        cache: 'pip'

    - name: 3. Install Required Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Execute Multi-Shop Scraper Pipeline
      run: |
        export TZ=Europe/Berlin
        
        NOW_DATE=$(date +'%Y-%m-%d')
        NOW_HOUR=$(date +'%H')
        
        if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
          if [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            NAME_TAG="run1"
          else
            NAME_TAG="run2"
          fi
        else
          NAME_TAG="manual_${NOW_HOUR}h"
        fi
        
        echo "Starte Scraper fuer Datum: $NOW_DATE und Zeitpunkt: $NAME_TAG"
        
        scrapy crawl tennistown -o data/raw/tennistown_${NOW_DATE}_${NAME_TAG}.csv &
        scrapy crawl tennis_heine -o data/raw/tennis_heine_${NOW_DATE}_${NAME_TAG}.csv &
        scrapy crawl tennis_point -o data/raw/tennis_point_${NOW_DATE}_${NAME_TAG}.csv &

        wait

    - name: 5. Persist Time-Series Raw Data to Repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Data Scraper"
        git add data/raw/*.csv
        git commit -m "chore: Automatisierter Abruf von Tennisdaten" || true
        git push